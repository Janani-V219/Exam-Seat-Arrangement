<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAM CELL LOGIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary-color: #4f92ff;
            --secondary-color: #93c5fd;
            --accent-color: #34d399;
            --text-dark: #1e293b;
            --text-light: #f8fafc;
            --bg-light: #f0f7ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            min-height: 100vh;
            background-color: #e0f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            position: relative;
            overflow: hidden;
        }

        /* Background Rectangle Elements */
        .bg-rectangle {
            position: absolute;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.15);
            z-index: 0;
        }

        .bg-rect-1 {
            width: 300px;
            height: 500px;
            top: -100px;
            left: 10%;
            transform: rotate(-15deg);
            background-color: rgba(140, 190, 255, 0.2);
        }

        .bg-rect-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: 5%;
            transform: rotate(10deg);
            background-color: rgba(140, 190, 255, 0.15);
        }

        .bg-rect-3 {
            width: 250px;
            height: 250px;
            top: 20%;
            right: 20%;
            transform: rotate(-5deg);
            background-color: rgba(200, 230, 255, 0.3);
        }
        
        .bg-rect-4 {
            width: 350px;
            height: 200px;
            bottom: 15%;
            left: 15%;
            transform: rotate(-10deg);
            background-color: rgba(150, 200, 255, 0.2);
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px var(--shadow);
            position: relative;
            z-index: 2;
        }

        .title {
            font-size: 32px;
            font-weight: 600;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--secondary-color);
            border-radius: 10px;
            font-size: 16px;
            background: var(--bg-light);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-light);
            background: linear-gradient(135deg, #5e9eff, #3a7dfd);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(79, 146, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: linear-gradient(135deg, #4a8bff, #2a70fd);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 146, 255, 0.4);
        }
        
        .btn i {
            margin-right: 10px;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 1000;
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            color: var(--text-light);
            font-weight: 500;
        }

        .notification.success { background: var(--accent-color); }
        .notification.error { background: #ef4444; }
        .notification i { margin-right: 12px; font-size: 20px; }
    </style>
</head>
<body>
    <!-- Background Rectangle Elements -->
    <div class="bg-rectangle bg-rect-1"></div>
    <div class="bg-rectangle bg-rect-2"></div>
    <div class="bg-rectangle bg-rect-3"></div>
    <div class="bg-rectangle bg-rect-4"></div>

    <div class="container">
        <h1 class="title">EXAM CELL LOGIN</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">
                <i class="fas fa-arrow-right"></i>
                Login
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const DEFAULT_USERNAME = 'faculty123';
        const DEFAULT_PASSWORD = 'spcet123';

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username === DEFAULT_USERNAME && password === DEFAULT_PASSWORD) {
                localStorage.setItem('loggedInFaculty', username);
                showNotification('Login successful!', 'success');
                setTimeout(() => window.location.href = 'faculty.html', 2000);
            } else {
                showNotification('Invalid username or password', 'error');
            }
        });

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'times-circle'}"></i><span>${message}</span>`;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '1';
                notification.style.transform = 'translateY(0)';
            }, 10);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateY(20px)';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
