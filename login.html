<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAM CELL LOGIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <!-- Background Rectangle Elements -->
    <div class="bg-rectangle bg-rect-1"></div>
    <div class="bg-rectangle bg-rect-2"></div>
    <div class="bg-rectangle bg-rect-3"></div>
    <div class="bg-rectangle bg-rect-4"></div>

    <div class="container">
        <h1 class="title">EXAM CELL LOGIN</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn">
                <i class="fas fa-arrow-right"></i>
                Login
            </button>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
