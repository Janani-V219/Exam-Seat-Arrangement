<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTOMATED  EXAM  SEAT  PLANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary-color: #60a5fa;
            --secondary-color: #93c5fd;
            --accent-color: #34d399;
            --text-dark: #1e293b;
            --text-light: #f8fafc;
            --bg-light: #f0f7ff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-light), #dbeafe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-dark);
            overflow: hidden;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 20px 60px var(--shadow);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--primary-color), transparent);
            opacity: 0.3;
            z-index: -1;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-color), transparent);
            opacity: 0.3;
            z-index: -1;
        }

        .title {
            font-size: 48px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 0 2px 8px var(--shadow);
            animation: fadeInDown 1s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            font-size: 22px;
            color: var(--text-dark);
            margin-bottom: 50px;
            font-weight: 400;
            animation: fadeIn 1.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 600;
            text-decoration: none;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(45deg);
            transition: all 0.3s ease;
        }

        .btn:hover::after {
            top: 0;
            left: 0;
        }

        .btn-teacher {
            background: var(--primary-color);
        }

        .btn-student {
            background: var(--accent-color);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px var(--shadow);
        }

        .btn i {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Welcome to Seating Portal..</h1>
        <p class="subtitle">Effortless Exam Seating for Faculty and Students</p>
        <div class="buttons">
            <a href="login.html" class="btn btn-teacher">
                <i class="fas fa-chalkboard-teacher"></i> EXAM CELL ACCESS
            </a>
            <a href="student.html" class="btn btn-student">
                <i class="fas fa-user-graduate"></i> STUDENT SEARCH
            </a>
        </div>
    </div>
</body>
</html>
