<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAM SEATING FINDER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/student.css">
</head>
<body>
    <div class="header">
        <h1 class="main-title">
            <i class="fas fa-graduation-cap"></i>
            EXAM SEATING FINDER
        </h1>
        <p>Enter your roll number to find your exam seat location and fine details</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="section-header">
                <i class="fas fa-search"></i>
                <h2>Find Your Exam Seat</h2>
            </div>
            
            <div class="layout-container">
                <div class="search-container">
                    <div class="search-section">
                        <input type="text" class="search-input" id="roll-number-input" placeholder="Enter your roll number (e.g., CS101)">
                        <button class="search-btn" id="search-btn">
                            <i class="fas fa-search"></i> Find My Seat
                        </button>
                    </div>
                    
                    <div class="result-section" id="result-section">
                        <div class="student-info" id="student-info">
                            <h3 id="student-name">Student Information</h3>
                            <div class="student-details" id="student-details">
                                <!-- Student details will be populated here -->
                            </div>
                        </div>
                        
                        <!-- Fine Amount Section -->
                        <div class="fine-section" id="fine-section" style="display: none;">
                            <div class="fine-header">
                                <i class="fas fa-exclamation-triangle"></i>
                                <h4>Fine Details</h4>
                            </div>
                            <div class="fine-amount" id="fine-amount">
                                Total Fine: ₹ 0
                            </div>
                            <div class="fine-details" id="fine-details">
                                <!-- Fine details will be populated here -->
                            </div>
                        </div>
                    </div>
                    
                    <div class="no-result" id="no-result">
                        <i class="fas fa-search"></i>
                        <h3>No Seat Found</h3>
                        <p>Enter your roll number and click "Find My Seat" to locate your exam seat</p>
                    </div>
                </div>
                
                <div class="room-visualization" id="room-visualization">
                    <div class="room-layout">
                        <div class="room-title" id="room-title">Room 201</div>
                        <div class="seat-container" id="seat-container">
                            <!-- Seat layout will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="js/student.js"></script>
</body>
</html>
